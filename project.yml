name: PingPongPaddle
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "14.0"
targets:
  PingPongPaddle:
    type: application
    platform: iOS
    sources:
      - PingPongPaddle
    info:
      path: PingPongPaddle/Info.plist
      properties:
        CFBundleDisplayName: Vot Bong Ban
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pingpongpaddle
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
